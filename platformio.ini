[env:x4_journal]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
extra_scripts = get_build_flags.py
build_flags =
    -DLOG_LOCAL_LEVEL=ESP_LOG_DEBUG
    -I src
    -I src/app
    -I src/crypto
    -I src/diagnostics
    -I src/ota
    -I src/platform
    -I src/storage
    -I src/ui
    -I src/web
lib_deps =
    EInkDisplay=symlink://open-x4-sdk/libs/display/EInkDisplay
    BatteryMonitor=symlink://open-x4-sdk/libs/hardware/BatteryMonitor
    InputManager=symlink://open-x4-sdk/libs/hardware/InputManager
    SDCardManager=symlink://open-x4-sdk/libs/hardware/SDCardManager
    greiman/SdFat@^2.3.1

# ---- Dev diagnostics build (HTTP API + verbose logs) -------------------------
[env:x4_journal_dev]
extends = env:x4_journal
build_flags =
    ${env:x4_journal.build_flags}
    -DCONFIG_X4_DEV_DIAGNOSTICS=1
    -DCONFIG_X4_DIAG_HTTP_API=1

# ---- Agent diagnostics build (strictest OTA health gate) ---------------------
[env:x4_journal_agent]
extends = env:x4_journal
build_flags =
    ${env:x4_journal.build_flags}
    -DCONFIG_X4_DEV_DIAGNOSTICS=1
    -DCONFIG_X4_AGENT_DIAGNOSTICS=1
    -DCONFIG_X4_DIAG_HTTP_API=1

